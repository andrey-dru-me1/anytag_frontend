version = 1
SPDX-PackageName = "Anytag Frontend"

[[annotations]]
path = [
  # Flutter auto-generated files
  "flutter_export_environment.sh",
  ".flutter-plugins",
  ".flutter-plugins-dependencies",
  ".packages",
  ".metadata",
  "pubspec.lock",

  # IDE files
  "*.iml",
  "*.iws",
  "*.ipr",
  ".vscode/*.json",
  ".vscode/launch.json",

  # Generic ignore files
  ".gitignore",
  "android/.gitignore",
  "ios/.gitignore",
  "linux/.gitignore",
  "macos/.gitignore",
  "windows/.gitignore",

  # Android (auto-generated by Flutter and Android tooling)
  "android/.gradle/**",
  "android/local.properties",
  "android/key.properties",
  "android/app/build/**",
  "android/build.gradle.kts",
  "android/app/build.gradle.kts",
  "android/settings.gradle.kts",
  "android/gradle.properties",
  "android/gradle/wrapper/gradle-wrapper.properties",
  "android/app/src/debug/AndroidManifest.xml",
  "android/app/src/profile/AndroidManifest.xml",
  "android/app/src/main/AndroidManifest.xml",
  "android/app/src/main/kotlin/com/example/anytag_frontend/MainActivity.kt",
  "android/app/src/main/res/values/styles.xml",
  "android/app/src/main/res/values-night/styles.xml",
  "android/app/src/main/res/drawable/launch_background.xml",
  "android/app/src/main/res/drawable-v21/launch_background.xml",
  "android/app/src/main/res/mipmap-hdpi/ic_launcher.png",
  "android/app/src/main/res/mipmap-mdpi/ic_launcher.png",
  "android/app/src/main/res/mipmap-xhdpi/ic_launcher.png",
  "android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png",
  "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",

  # iOS (auto-generated by Flutter and Xcode)
  "ios/Pods/**",
  "ios/.symlinks/**",
  "ios/Flutter/AppFrameworkInfo.plist",
  "ios/Flutter/Debug.xcconfig",
  "ios/Flutter/Release.xcconfig",
  "ios/Runner/AppDelegate.swift",
  "ios/Runner/SceneDelegate.swift",
  "ios/Runner/Runner-Bridging-Header.h",
  "ios/Runner/Info.plist",
  "ios/Runner/Base.lproj/LaunchScreen.storyboard",
  "ios/Runner/Base.lproj/Main.storyboard",
  "ios/Runner/Assets.xcassets/**",
  "ios/RunnerTests/RunnerTests.swift",
  "ios/Runner.xcodeproj/project.pbxproj",
  "ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme",
  "ios/Runner.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings",
  "ios/Runner/GeneratedPluginRegistrant.*",

  # Linux (auto-generated by Flutter)
  "linux/flutter/**",
  "linux/CMakeLists.txt",
  "linux/runner/CMakeLists.txt",
  "linux/runner/main.cc",
  "linux/runner/my_application.cc",
  "linux/runner/my_application.h",

  # macOS (auto-generated by Flutter)
  "macos/flutter/**",
  "macos/Flutter/Flutter-Debug.xcconfig",
  "macos/Flutter/Flutter-Release.xcconfig",
  "macos/Runner/AppDelegate.swift",
  "macos/Runner/MainFlutterWindow.swift",
  "macos/Runner/Info.plist",
  "macos/Runner/DebugProfile.entitlements",
  "macos/Runner/Release.entitlements",
  "macos/Runner/Assets.xcassets/**",
  "macos/Runner/Base.lproj/MainMenu.xib",
  "macos/Runner/Configs/*.xcconfig",
  "macos/RunnerTests/RunnerTests.swift",
  "macos/Runner.xcodeproj/project.pbxproj",
  "macos/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme",

  # Web (auto-generated by Flutter)
  "web/icons/**",
  "web/favicon.png",
  "web/index.html",
  "web/manifest.json",

  # Windows (auto-generated by Flutter)
  "windows/flutter/**",
  "windows/CMakeLists.txt",
  "windows/runner/CMakeLists.txt",
  "windows/runner/flutter_window.cpp",
  "windows/runner/flutter_window.h",
  "windows/runner/main.cpp",
  "windows/runner/utils.cpp",
  "windows/runner/utils.h",
  "windows/runner/win32_window.cpp",
  "windows/runner/win32_window.h",
  "windows/runner/resource.h",
  "windows/runner/Runner.rc",
  "windows/runner/runner.exe.manifest",
  "windows/runner/resources/app_icon.ico",

  # Build artifacts and caches
  "coverage/**",
  "build/**",
  ".dart_tool/**",
  "result*",

  # Development configs
  ".prototools",
  ".python-version",

  # Images
  "assets/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Anytag Frontend Authors"
SPDX-License-Identifier = "AGPL-3.0-only"
